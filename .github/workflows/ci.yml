name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install linters
        run: pip install flake8 black isort
      - name: Run flake8
        run: flake8 api/ ui/ --max-line-length=120 --select=E9,F63,F7,F82 --exclude=api/main.py
      - name: Check black formatting
        run: black --check --line-length=120 api/ ui/ || true
      - name: Check import sorting
        run: isort --check-only api/ ui/ || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio "httpx<0.28"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t taxi-app:${{ github.sha }} -f Dockerfile .
      - name: Test container (import check)
        run: |
          docker run --rm \
            -e MLFLOW_TRACKING_URI=http://localhost:1 \
            taxi-app:${{ github.sha }} \
            python3 -c "
import sys; sys.path.insert(0, '/app')
import api.taxi_full_api as m
print('Import OK, app =', m.app.title)
"
      - name: Test container health
        run: |
          docker run -d --name test-api -p 8000:8000 \
            -e MLFLOW_TRACKING_URI=http://localhost:1 \
            -e MLFLOW_HTTP_REQUEST_MAX_RETRIES=0 \
            taxi-app:${{ github.sha }} \
            uvicorn api.taxi_full_api:app --host 0.0.0.0 --port 8000
          HEALTHY=false
          for i in $(seq 1 30); do
            if ! docker ps -q --filter name=test-api | grep -q .; then
              echo "Container exited unexpectedly!"
              docker logs test-api
              exit 1
            fi
            if curl -sf http://localhost:8000/health; then
              HEALTHY=true
              break
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          docker logs test-api
          docker stop test-api || true
          if [ "$HEALTHY" != "true" ]; then
            echo "API never became healthy after 60s"
            exit 1
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build and tag image
        run: |
          docker build -t taxi-app:latest -f Dockerfile .
          docker tag taxi-app:latest taxi-app:${{ github.sha }}
      - name: Deploy notification
        run: echo "Image built successfully. Ready for K8s deployment."
