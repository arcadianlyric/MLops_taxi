name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install linters
        run: pip install flake8 black isort
      - name: Run flake8
        run: flake8 api/ ui/ --max-line-length=120 --ignore=E501,W503,E402
      - name: Check black formatting
        run: black --check --line-length=120 api/ ui/ || true
      - name: Check import sorting
        run: isort --check-only api/ ui/ || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t taxi-app:${{ github.sha }} -f Dockerfile .
      - name: Test container health
        run: |
          docker run -d --name test-api -p 8000:8000 taxi-app:${{ github.sha }} \
            uvicorn api.taxi_full_api:app --host 0.0.0.0 --port 8000
          sleep 10
          curl -f http://localhost:8000/health
          docker stop test-api

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build and tag image
        run: |
          docker build -t taxi-app:latest -f Dockerfile .
          docker tag taxi-app:latest taxi-app:${{ github.sha }}
      - name: Deploy notification
        run: echo "Image built successfully. Ready for K8s deployment."
