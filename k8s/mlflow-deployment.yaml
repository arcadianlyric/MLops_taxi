apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: mlops-system
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-config
  namespace: mlops-system
data:
  mlflow.conf: |
    [mlflow]
    backend_store_uri = sqlite:///mlflow/mlflow.db
    default_artifact_root = /mlflow/artifacts
    host = 0.0.0.0
    port = 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: python:3.9-slim
        ports:
        - containerPort: 5000
        command: ["/bin/bash"]
        args:
          - -c
          - |
            pip install mlflow>=2.8.0 psycopg2-binary
            mkdir -p /mlflow/artifacts
            mlflow server \
              --backend-store-uri sqlite:///mlflow/mlflow.db \
              --default-artifact-root /mlflow/artifacts \
              --host 0.0.0.0 \
              --port 5000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: mlflow-data
          mountPath: /mlflow
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://0.0.0.0:5000"
      volumes:
      - name: mlflow-data
        emptyDir: {}
