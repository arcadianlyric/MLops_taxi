apiVersion: v1
kind: Namespace
metadata:
  name: taxi-app
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: taxi-app
spec:
  selector:
    app: fastapi
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-service
  namespace: taxi-app
spec:
  selector:
    app: streamlit
  ports:
    - port: 8501
      targetPort: 8501
      nodePort: 30851
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: taxi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: fastapi
        image: taxi-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        command: ["uvicorn"]
        args: ["api.taxi_simple_api:app", "--host", "0.0.0.0", "--port", "8000"]
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  namespace: taxi-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      containers:
      - name: streamlit
        image: taxi-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8501
        command: ["streamlit"]
        args: ["run", "ui/streamlit_app.py", "--server.port", "8501", "--server.headless", "true", "--server.address", "0.0.0.0"]
        env:
        - name: API_BASE_URL
          value: "http://fastapi-service:8000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
