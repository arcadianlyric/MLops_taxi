apiVersion: batch/v1
kind: Job
metadata:
  name: tfx-taxi-pipeline
  namespace: taxi-app
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: tfx-pipeline
    spec:
      restartPolicy: Never
      containers:
      - name: tfx-runner
        image: tensorflow/tfx:0.21.4
        command: ["python3"]
        args: ["/app/tfx_pipeline/taxi_pipeline_simple.py"]
        volumeMounts:
        - name: pipeline-code
          mountPath: /app
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: pipeline-code
        hostPath:
          path: /Users/yc/Documents/GitHub/MLops_taxi
          type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tfx-model-storage
  namespace: taxi-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
